[workspace]
members = ["hilo-core", "hilo-metadata", "hilo-graph", "hilo-cli", "hilo-mcp", "hilo-backends", "hilo-triggers", "hilo-fuse", "hilo-plugins", "hilo-permissions", "hilo-ffi"]
resolver = "2"

# PERF-003: the dev binary linked every workspace crate plus duckdb with full
# debuginfo and hit 1.22 GB (release: 118 MB). Keep line tables for workspace
# crates (backtrace symbols survive), drop debuginfo from dependencies
# entirely. Same rebuild, ~90% smaller dev binary.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# PERF-006: the release binary carried ZERO `.debug_` sections, so 55.4% of a
# perf profile came back `[unknown]` and more than half of every sample was
# unattributable to a function. Line tables cost binary size, NOT runtime, and
# let `perf record` / cargo-flamegraph resolve frames for workspace crates AND
# dependencies (duckdb worker threads included). `strip = "none"` is required:
# without it the symbols we just emitted are stripped back out of the artefact.
# A shippable artefact can still be stripped separately; the workspace default
# stays symbolizable so future profiles are readable.
[profile.release]
debug = 1
strip = "none"

[workspace.package]
version = "0.3.1-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/gethilo/hilo"

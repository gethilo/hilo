[package]
name = "hilo_mcp"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gethilo/hilo"
description = "Hilo MCP server — stdio-based Model Context Protocol server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# REV-WARPFS-3: HTTP transport (`hilo serve --http`). axum for the router +
# `axum::serve`, tokio for the async runtime (rt + net for TcpListener).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net"] }
hilo_metadata = { path = "../hilo-metadata" }
hilo_graph = { path = "../hilo-graph" }
hilo_core = { path = "../hilo-core" }
hilo_backends = { path = "../hilo-backends" }

[dev-dependencies]
tempfile = "3"

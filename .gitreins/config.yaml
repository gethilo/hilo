guards:
  secrets: true
  lint: false
  tests: true
  test_mode: full
  test_command: cargo test
  lsp: true
  lsp_tools: ["rust-analyzer"]
  static_analysis: true
  static_analysis_tools: {}
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 2M
  max_output_tokens: 500000
  file_scope: changed
  code_context_budget: 0.70
  compaction_threshold: 0.90
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000

guards:
  secrets: true
  lint: false
  tests: true
  test_mode: diff
  test_command: cargo test -p hilo_graph --lib
  test_timeout: 300
  hook_timeout: 600
  lsp: true
  lsp_tools: ["rust-analyzer"]
  static_analysis: true
  static_analysis_tools: {}
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 5M
  max_output_tokens: 300000
  file_scope: changed
  code_context_budget: 0.70
  compaction_threshold: 0.90
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-pro
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000

pipeline:
  stages:
    - id: tier2
      type: ai_eval
      "on": [pre-eval]
      condition: "true"
      max_iterations: 100
      max_time: 30m
      max_input_tokens: 5000000
      max_output_tokens: 300000
      tools: [read_file, run_command, search_pattern, read_diff]

guards:
  secrets: true
  lint: false
  tests: true
  # Run Clippy through the fail-closed command guard: the native static
  # analyzer prioritizes Makefile over Cargo.toml and swallows tool failures.
  test_mode: full
  test_on_clean: true
  test_command: bash scripts/rust-lint.sh
  # 300 -> 900 (GAP-120 tick): rust-lint.sh (clippy --workspace --all-targets
  # + hilo_graph lib tests) exceeds 300s under shared-host load; both green
  # runs TIMED OUT at 300, which is a wall-clock limit, not a test failure.
  test_timeout: 900
  # 600 -> 1200 (DF-WARPFS-178): a hook budget BELOW the test budget guarantees
  # the gate loses its own race — every commit that fires the hook blocks for
  # the hook timeout and then fails, training agents to bypass hooks. The hook
  # wraps the same test command, so its budget must exceed the test budget.
  hook_timeout: 1200
  # Disabled: the native LSP leg fails open — engine/lsp.py run_lsp_check()
  # returns [] both when the tool is missing on PATH ("not found on PATH -
  # skipping") and when it fails to initialize, and guard_manager.py
  # _check_lsp() swallows every exception; the empty diagnostic list then
  # prints "  rust-analyzer — clean" and PASSES, so a rustup shim with no
  # rust-analyzer component reported a clean tick for a leg that did no work
  # (INT-GITREINS-003). Enforced instead inside scripts/rust-lint.sh
  # (test_command above), which fails closed on a missing or broken tool.
  lsp: false
  lsp_tools: []
  # Clippy is enforced above; disable the misleading native cppcheck path.
  static_analysis: false
  static_analysis_tools: {}
evaluator:
  max_iterations: 200
  max_time: 90m
  max_input_tokens: 5M
  max_output_tokens: 300000
  file_scope: changed
  code_context_budget: 0.70
  compaction_threshold: 0.90
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  # DOCUMENTATION ONLY — the tier-2 evaluator never reads this block; the judge
  # lane is resolved from the environment (GITREINS_LLM_BASE_URL/MODEL/API_KEY).
  # The ambient env names the deepseek lane, whose account 402s every call
  # (DF-WARPFS-177), so run ALL judges through the repo wrapper, which exports
  # the funded lane for the invocation:
  #   bash scripts/gitreins-judge-lane.sh task complete <TASK-ID>
  model: glm-5.3-flash

history:
  enabled: true
  storage: git
  max_verdicts: 1000

pipeline:
  stages:
    - id: tier2
      type: ai_eval
      "on": [pre-eval]
      condition: "true"
      max_iterations: 200
      max_time: 90m
      max_input_tokens: 5000000
      max_output_tokens: 300000
      tools: [read_file, run_command, search_pattern, read_diff]

[package]
name = "hilo_metadata"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gethilo/hilo"
description = "Hilo metadata engine — xattr read/write and inventory file I/O"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
xattr = "1"
# REV-WARPFS-8: advisory cross-process flock for edges.jsonl writers (warm,
# trigger append, graph gc serialize on <edges.jsonl>.lock). Already resolved
# in the workspace lock via the cap-std family, so this adds no new crate.
fd-lock = "4"

[dev-dependencies]
tempfile = "3"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # GAP-089: cap test threads on shared runners
  RUST_TEST_THREADS: "8"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install system dependencies
        # QA-WARPFS-23: libssl-dev is no longer required — OpenSSL is vendored
        # by default (hilo_backends). Kept installed so the optional
        # system-OpenSSL build path stays exercisable; the build does not need it.
        # ch:trace row=INT-CI-017 spec=docs/releasing.md#release-checklist wave=none:serial test=.github/workflows/ci.yml::Install-system-dependencies doc=docs/releasing.md evidence=none:ci-run-required witness=none:hosted-run-required verdict=none:open-finding commit=none:not-shipped memory=none:not-written
        run: |
          packages=(libfuse3-dev attr pkg-config libssl-dev)

          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y "${packages[@]}"; then
                return 0
              fi
              if (( attempt < 3 )); then
                sleep 5
              fi
            done
            return 1
          }

          if ! apt_retry; then
            ubuntu_codename=$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")
            sudo tee /etc/apt/sources.list.d/ubuntu-mirrors.list >/dev/null <<EOF
          deb http://archive.ubuntu.com/ubuntu/ ${ubuntu_codename} main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ ${ubuntu_codename}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${ubuntu_codename}-security main restricted universe multiverse
          EOF
            apt_retry
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Advisory gate (runtime-reachable RustSec)
        run: bash scripts/audit-gate.sh
